name: Credit Risk MLOps CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Code Quality, Tests & Responsible AI Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Code Style & Lint Check (flake8)
        run: uv run flake8 src app tests scripts simulations

      - name: Run Test Suite & Coverage Gate (pytest >= 80% coverage)
        run: uv run pytest -v tests/ --cov=src --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run Responsible AI Fairness & Explainability Audit
        run: uv run python scripts/run_fairness_audit.py

  docker-build-and-smoke-test:
    name: Docker Build & Smoke Test
    needs: [lint-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-risk-api:ci-test -f Dockerfile .

      - name: Run Serving Container
        run: |
          docker run -d --name test-api \
            -p 8000:8000 \
            -e MODEL_NAME=credit_model_v1.joblib \
            -e DATABASE_URL="" \
            credit-risk-api:ci-test
          sleep 5

      - name: Healthcheck Polling
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health | grep -q '"status":"healthy"'; then
              echo "✓ API Healthcheck passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck timeout"
          docker logs test-api
          exit 1

      - name: Verify Inference & Telemetry
        run: |
          curl -s -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"LIMIT_BAL": 100000.0, "SEX": 1, "EDUCATION": 2, "MARRIAGE": 1, "AGE": 30, "PAY_0": 0, "PAY_2": 0, "PAY_3": 0, "PAY_4": 0, "PAY_5": 0, "PAY_6": 0, "BILL_AMT1": 5000.0, "BILL_AMT2": 4000.0, "BILL_AMT3": 3000.0, "BILL_AMT4": 2000.0, "BILL_AMT5": 1000.0, "BILL_AMT6": 500.0, "PAY_AMT1": 1000.0, "PAY_AMT2": 1000.0, "PAY_AMT3": 1000.0, "PAY_AMT4": 1000.0, "PAY_AMT5": 1000.0, "PAY_AMT6": 1000.0}' \
            | grep -q '"risk_decision"'
          curl -s http://localhost:8000/metrics | grep -q 'credit_prediction_requests_total'
          echo "✓ All live smoke checks passed!"

      - name: Cleanup
        if: always()
        run: |
          docker stop test-api || true
          docker rm test-api || true
