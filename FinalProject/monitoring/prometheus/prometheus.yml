# Prometheus configuration for the Credit Default Risk Scoring stack.
# Job names are part of the alerting contract: rules/ and Grafana dashboards
# select on `job`. Keep them in sync.

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    project: credit-risk-mlops

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: credit-risk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: drift-monitor
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["drift-monitor:8085"]
        labels:
          component: drift

  # Airflow pushes StatsD to statsd-exporter; it also relays the
  # credit_retrain_* gauges emitted by the model_retrain DAG.
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]
        labels:
          component: orchestration

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: alerting

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: dashboards

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          component: storage
