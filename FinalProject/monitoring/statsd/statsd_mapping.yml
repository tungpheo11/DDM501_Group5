# StatsD -> Prometheus mapping (statsd-exporter, scraped as job "airflow").
# Airflow emits metrics with prefix "airflow"; the model_retrain DAG callbacks
# emit "credit.retrain.*" gauges that drive the RetrainFailed alert.

mappings:
  - match: "credit.retrain.last_run_failed"
    name: "credit_retrain_last_run_failed"
    help: "1 when the last model_retrain DAG run failed, 0 after a successful run"

  - match: "credit.retrain.last_run_timestamp"
    name: "credit_retrain_last_run_timestamp_seconds"
    help: "Unix time of the last finished model_retrain DAG run"

  - match: "credit.retrain.last_promoted_version"
    name: "credit_retrain_last_promoted_version"
    help: "Registry version promoted to @champion by the last successful retrain"

  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_task_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.ti.start.*.*"
    name: "airflow_task_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti_failures"
    name: "airflow_task_failures_total"

  - match: "airflow.ti_successes"
    name: "airflow_task_successes_total"

  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"

  - match: "airflow.dag_processing.import_errors"
    name: "airflow_dag_import_errors"

  - match: "airflow.dagbag_size"
    name: "airflow_dagbag_size"
