apiVersion: 1

# JSON files are generated by scripts/build_grafana_dashboards.py.
providers:
  - name: credit-risk
    orgId: 1
    folder: Credit Risk
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
