# Nginx reverse proxy for the Credit Risk stack (Ubuntu 22.04 / 24.04).
#
# install.sh copies this file to /etc/nginx/sites-available/credit-risk.conf and replaces
# __API_DOMAIN__ / __GRAFANA_DOMAIN__. Only the scoring API and Grafana are published;
# MLflow, Airflow, Prometheus, Alertmanager and MinIO stay on 127.0.0.1 (SSH tunnel).
#
# TLS: `sudo certbot --nginx -d <api-domain> -d <grafana-domain> --redirect` adds the
# 443 server blocks and the HTTP -> HTTPS redirect to this file; certbot.timer renews.
# Every container port binds 127.0.0.1 (docker-compose.prod.yml), so Nginx is the
# only way in from the network.

limit_req_zone $binary_remote_addr zone=credit_api:10m rate=20r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Keep the caller's X-Request-ID for end-to-end tracing; otherwise use Nginx's own id.
map $http_x_request_id $credit_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream credit_api {
    server 127.0.0.1:18020;
    keepalive 16;
}

upstream credit_grafana {
    server 127.0.0.1:13000;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/credit-risk-api.access.log;
    error_log /var/log/nginx/credit-risk-api.error.log warn;

    location /api/ {
        limit_req zone=credit_api burst=40 nodelay;
        proxy_pass http://credit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $credit_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://credit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Swagger UI + OpenAPI contract for API consumers.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://credit_api;
        proxy_set_header Host $host;
    }

    # Prometheus scrapes /metrics over the internal Docker network only.
    location /metrics {
        return 404;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __GRAFANA_DOMAIN__;

    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/credit-risk-grafana.access.log;
    error_log /var/log/nginx/credit-risk-grafana.error.log warn;

    location / {
        proxy_pass http://credit_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
