# Credit Default Risk Scoring - full MLOps stack.
# Paths are relative to this file (deploy/compose/). Start via `make up` from FinalProject/.
#
# Profiles (COMPOSE_PROFILES, default in the Makefile: core,monitoring,orchestration):
#   core           postgres, minio, mlflow, model-bootstrap, api
#   monitoring     drift-monitor, prometheus, alertmanager, alert-webhook, grafana, statsd-exporter
#   orchestration  airflow-init, airflow-webserver, airflow-scheduler
# Cross-profile dependencies are `required: false` so each profile also starts on its own.
# One-shot jobs (minio-init, model-bootstrap, airflow-init) are gated by
# `service_completed_successfully`; every long-running service has a healthcheck.
name: credit-risk-mlops

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-mlops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlopspass}
  POSTGRES_DB: ${POSTGRES_DB:-credit_mlops_db}

x-mlflow-client-env: &mlflow-client-env
  MODEL_NAME: ${MODEL_NAME:-credit-risk-model}
  MODEL_ALIAS: ${MODEL_ALIAS:-champion}
  EXPERIMENT_NAME: ${EXPERIMENT_NAME:-credit-default-risk-scoring}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: orchestration/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE:-credit-risk-airflow:local}
  profiles: ["orchestration"]
  logging: *default-logging
  environment: &airflow-env
    <<: [*db-env, *mlflow-client-env]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env (see .env.example)}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:18080}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env (see .env.example)}
    APP_ENV: docker
    LOG_FORMAT: text
    API_URL: http://api:8000
    API_KEY: ${API_KEY:-${API_KEYS}}
    DRIFT_MONITOR_URL: http://drift-monitor:8085
    PROMETHEUS_URL: http://prometheus:9090
    ALERTMANAGER_URL: http://alertmanager:9093
    ALERT_WEBHOOK_URL: http://alert-webhook:9095/alerts
    MLFLOW_PUBLIC_URL: http://localhost:${MLFLOW_PORT:-15040}
    DRIFT_MONITOR_PUBLIC_URL: http://localhost:${DRIFT_MONITOR_PORT:-18085}
    DRIFT_WINDOW_SIZE: ${DRIFT_WINDOW_SIZE:-500}
    DRIFT_MONITORING_SCHEDULE: ${DRIFT_MONITORING_SCHEDULE:-*/30 * * * *}
    RETRAIN_COOLDOWN_MINUTES: ${RETRAIN_COOLDOWN_MINUTES:-60}
    RETRAIN_MIN_ROC_AUC: ${RETRAIN_MIN_ROC_AUC:-0.70}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  volumes:
    - ../../orchestration/airflow/dags:/opt/airflow/orchestration/dags:ro
    - ../../orchestration/airflow/utils:/opt/airflow/orchestration/utils:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
      required: false
    airflow-init:
      condition: service_completed_successfully

services:
  # ===========================================================================
  # core
  # ===========================================================================
  postgres:
    image: postgres:16.15-alpine
    profiles: ["core"]
    restart: unless-stopped
    environment: *db-env
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  # MinIO no longer publishes images (quay.io/minio and docker.io/minio are gone);
  # pgsty/* are community rebuilds of the same server/mc sources. Keep minio and
  # minio-init on the same RELEASE tag and pinned by multi-arch index digest.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    profiles: ["core"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT:-19040}:9000"
      - "${MINIO_CONSOLE_PORT:-19041}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  minio-init:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z@sha256:b57234d21057175b6c3358509733128e35da330094aaacf37bf33348b11d1f92
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_BUCKET: ${MINIO_BUCKET:-mlflow}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *default-logging

  mlflow:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${API_BUILD_IMAGE:-credit-risk-api:local}
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      # MLflow 3.x otherwise forks ~7 huey job consumers (~150 MB each) and gets
      # OOM-killed under the 1G limit; server-side jobs are not used here.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # MLflow 3.x answers 403 "Cross-origin request blocked" to UI POST calls whose
      # Origin is not localhost; list the public UI origin(s) here when not using a tunnel.
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:-}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/${POSTGRES_DB:-credit_mlops_db}
      --default-artifact-root s3://${MINIO_BUCKET:-mlflow}/
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts "*"
    ports:
      - "${MLFLOW_PORT:-15040}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *default-logging

  # Registers the baked-in model as @champion on a fresh registry so the API
  # serves from MLflow (not the degraded local fallback). No-op afterwards.
  model-bootstrap:
    image: ${API_BUILD_IMAGE:-credit-risk-api:local}
    profiles: ["core"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *mlflow-client-env
      APP_ENV: docker
      LOG_FORMAT: text
    volumes:
      - ../../data/reference:/app/data/reference:ro
    command:
      - python
      - -c
      - |
        import sys, time
        from credit_risk.training.registry import bootstrap_champion
        for attempt in range(1, 6):
            try:
                change = bootstrap_champion()
                print("registered @champion:", change) if change else print("@champion already exists")
                sys.exit(0)
            except Exception as exc:
                print(f"bootstrap attempt {attempt} failed: {exc}", flush=True)
                time.sleep(5 * attempt)
        sys.exit(1)
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: ${API_BUILD_IMAGE:-credit-risk-api:local}
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *mlflow-client-env
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/${POSTGRES_DB:-credit_mlops_db}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.30}
      DECLINE_THRESHOLD: ${DECLINE_THRESHOLD:-0.60}
      API_KEYS: ${API_KEYS:?set API_KEYS in .env (see .env.example)}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PSEUDONYMIZATION_KEY: ${PSEUDONYMIZATION_KEY:-}
      # gunicorn workers (ADR-0007): keep equal to the CPU limit below; 1 = single-process rollback.
      API_WORKERS: ${API_WORKERS:-2}
    ports:
      - "${API_PORT:-18020}:8000"
    volumes:
      - ../../src:/app/src:ro
      - ../../configs:/app/configs:ro
      - ../../models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        # ~350 MB per worker plus headroom for a hot reload / SHAP explanations.
        limits: {cpus: "2.0", memory: 1536M}
    logging: *default-logging

  # ===========================================================================
  # monitoring
  # ===========================================================================
  drift-monitor:
    build:
      context: ../..
      dockerfile: services/drift_monitor/Dockerfile
    image: ${DRIFT_MONITOR_IMAGE:-credit-risk-drift-monitor:local}
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      model-bootstrap:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *mlflow-client-env
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/${POSTGRES_DB:-credit_mlops_db}
      DRIFT_WINDOW_SIZE: ${DRIFT_WINDOW_SIZE:-500}
      DRIFT_ANALYSIS_INTERVAL_SECONDS: ${DRIFT_ANALYSIS_INTERVAL_SECONDS:-60}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${DRIFT_MONITOR_PORT:-18085}:8085"
    volumes:
      - drift-reports:/var/lib/drift-monitor/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/render_config.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERTMANAGER_EXTERNAL_URL: http://localhost:${ALERTMANAGER_PORT:-19093}
    ports:
      - "${ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ../../monitoring/alertmanager/render_config.sh:/etc/alertmanager/render_config.sh:ro
      - ../../monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    tmpfs:
      - /tmp/alertmanager:mode=0700,uid=65534
    depends_on:
      alert-webhook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *default-logging

  # Fallback alert receiver: always gets every alert (Telegram is optional).
  alert-webhook:
    image: python:3.11.16-slim-trixie@sha256:e41613d42d4891e4930f79523f93f81bbc7632584ec65e36ab055f41a800b41e
    profiles: ["monitoring"]
    restart: unless-stopped
    user: "65534:65534"
    command: ["python", "-u", "/app/webhook_receiver.py"]
    environment:
      ALERT_WEBHOOK_PORT: "9095"
    ports:
      - "${ALERT_WEBHOOK_PORT:-19095}:9095"
    volumes:
      - ../../monitoring/alertmanager/webhook_receiver.py:/app/webhook_receiver.py:ro
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infra_sla.json
      # Grafana 13 preinstalls Pyroscope/Loki/Traces drilldown apps; none are used here and they
      # saturate the container budget (dashboard loads >30 s at 384M).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}
    logging: *default-logging

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    profiles: ["monitoring", "orchestration"]
    restart: unless-stopped
    command:
      - --statsd.mapping-config=/etc/statsd/statsd_mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    ports:
      - "${STATSD_EXPORTER_PORT:-19102}:9102"
    volumes:
      - ../../monitoring/statsd/statsd_mapping.yml:/etc/statsd/statsd_mapping.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    logging: *default-logging

  # ===========================================================================
  # orchestration
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "/opt/airflow/init_airflow.sh"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1536M}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      statsd-exporter:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8974/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2560M}

volumes:
  pgdata:
  miniodata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  drift-reports:
  airflow-logs:
