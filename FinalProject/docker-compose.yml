services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL: Central metadata & Inference Logs Store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: credit-mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlopspass}
      POSTGRES_DB: ${POSTGRES_DB:-credit_mlops_db}
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-credit_mlops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. MinIO: S3 Compatible Object Storage for Model Artifacts
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: credit-mlops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${MINIO_API_PORT:-19040}:9000"
      - "${MINIO_CONSOLE_PORT:-19041}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Helper: Ensure 'mlflow' S3 bucket exists
  minio-init:
    image: minio/mc:latest
    container_name: credit-mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-miniopassword};
      mc mb myminio/${MINIO_BUCKET:-mlflow} || true;
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # 3. MLflow Tracking Server & Model Registry
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-mlops-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/${POSTGRES_DB:-credit_mlops_db}
      --default-artifact-root s3://${MINIO_BUCKET:-mlflow}/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
    ports:
      - "${MLFLOW_PORT:-15040}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 4. FastAPI Model Serving Microservice
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-mlops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MODEL_NAME: ${MODEL_NAME:-credit-risk-model}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlopspass}@postgres:5432/${POSTGRES_DB:-credit_mlops_db}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.30}
      DECLINE_THRESHOLD: ${DECLINE_THRESHOLD:-0.60}
    ports:
      - "${API_PORT:-18020}:8000"
    volumes:
      - ./app:/app/app:ro
      - ./src:/app/src:ro
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ---------------------------------------------------------------------------
  # 5. Prometheus: Real-time Telemetry Scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-mlops-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # 6. Grafana: Visual Monitoring Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: credit-mlops-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
