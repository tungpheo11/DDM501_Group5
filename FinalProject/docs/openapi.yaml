      summary: Hot-reload the champion model
      description: Reloads `models:/<name>@<alias>` from MLflow (local artifact if
        MLflow is unreachable) without downtime. Idempotent. If loading fails the
        previous model keeps serving (`status=unchanged_on_failure`); 503 only when
        no model is available at all.
      operationId: reload_model_api_v1_model_reload_post
      responses:
        '200':
          description: Successful Response
