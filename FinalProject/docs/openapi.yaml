      summary: Prometheus scrape endpoint
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              example: '# TYPE credit_model_loaded gauge

                credit_model_loaded 1.0

                credit_prediction_requests_total{decision="APPROVE",status="200"}
                42.0

                '
components:
  schemas:
    BatchPredictRequest:
      properties:
        applicants:
          items:
            $ref: '#/components/schemas/CreditPredictRequest'
          type: array
          minItems: 1
          title: Applicants
          description: Applicants to score; the server caps the size (see `batch_max_size`).
      additionalProperties: false
      type: object
      required:
      - applicants
      title: BatchPredictRequest
      description: Several applicants scored in one vectorized call.
    BatchPredictionItem:
      properties:
        default_prediction:
          type: integer
          title: Default Prediction
          description: 0 = no default expected, 1 = default risk
        default_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Default Probability
          description: Probability of default (0.0 to 1.0)
        credit_score:
          type: integer
          maximum: 850.0
          minimum: 300.0
          title: Credit Score
          description: Credit score on a 300-850 scale (higher is better)
        credit_tier:
          type: string
          enum:
          - PRIME
          - NEAR_PRIME
          - SUBPRIME
          - HIGH_RISK
          title: Credit Tier
          description: Risk tier
        risk_decision:
          type: string
          enum:
          - APPROVE
          - REVIEW
          - DECLINE
          title: Risk Decision
          description: Business decision
        recommended_limit_ntd:
          type: number
          minimum: 0.0
          title: Recommended Limit Ntd
          description: Suggested safe credit limit in NT dollars
        top_risk_factors:
          items:
            type: string
          type: array
          title: Top Risk Factors
          description: Human-readable drivers of the score
        policy_guardrails:
          additionalProperties:
            type: string
          type: object
          title: Policy Guardrails
          description: Deterministic compliance checks
        index:
          type: integer
          minimum: 0.0
          title: Index
          description: Position of the applicant in the request
        request_id:
          type: string
          title: Request Id
          description: Per-item id (`<batch request id>-<index>`) stored in the inference
            log
      type: object
      required:
      - default_prediction
      - default_probability
      - credit_score
      - credit_tier
      - risk_decision
      - recommended_limit_ntd
      - index
      - request_id
      title: BatchPredictionItem
      description: Result for one applicant of a batch, in request order.
    BatchPredictionResponse:
      properties:
        model_version:
          type: string
          title: Model Version
          description: Registry version number, or the artifact name in fallback mode
        served_by:
          type: string
          title: Served By
          description: 'Model source: mlflow_registry or local_artifact'
        request_id:
          type: string
          title: Request Id
        count:
          type: integer
          title: Count
        decision_summary:
          additionalProperties:
            type: integer
          type: object
          title: Decision Summary
          description: Number of applicants per decision
        predictions:
          items:
            $ref: '#/components/schemas/BatchPredictionItem'
          type: array
          title: Predictions
        latency_ms:
          type: number
          title: Latency Ms
      type: object
      required:
      - model_version
      - served_by
      - request_id
      - count
      - decision_summary
      - predictions
      - latency_ms
      title: BatchPredictionResponse
      description: Scoring result for ``POST /api/v1/predict/batch``.
      examples:
      - count: 2
        decision_summary:
          APPROVE: 1
          DECLINE: 1
          REVIEW: 0
        latency_ms: 14.9
        model_version: '3'
        predictions:
        - credit_score: 783
          credit_tier: PRIME
          default_prediction: 0
          default_probability: 0.1215
          index: 0
          policy_guardrails:
            age_verification: PASS
            delinquency_guardrail: CLEAR
            utilization_ceiling_check: ACCEPTABLE
          recommended_limit_ntd: 250000.0
          request_id: req_9b8a7e4f1c2b7e9a0d4c3b8e2f6a1d0c-0
          risk_decision: APPROVE
          top_risk_factors:
          - 'Repayment Discipline: Timely and structured monthly repayments'
        - credit_score: 420
          credit_tier: HIGH_RISK
          default_prediction: 1
          default_probability: 0.7812
          index: 1
          policy_guardrails:
            age_verification: PASS
            delinquency_guardrail: ELEVATED_DEFAULT_RISK
            utilization_ceiling_check: OVER_UTILIZED_WARNING
          recommended_limit_ntd: 0.0
          request_id: req_9b8a7e4f1c2b7e9a0d4c3b8e2f6a1d0c-1
          risk_decision: DECLINE
          top_risk_factors:
          - 'Severe Delinquency: PAY_0=2 indicates 2+ months payment default'
