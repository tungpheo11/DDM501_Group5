  /health/live:
    get:
      tags:
      - health
      summary: Liveness probe
      description: 200 while the process can handle HTTP. Does not touch the model
        or any dependency.
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      description: '`ready`: champion from MLflow and all dependencies up. `degraded`
        (still 200): serving the local fallback model and/or MLflow or the database
        is down. `not_ready` (503): no model loaded. Dependency probes are cached
        for `readiness_cache_seconds`.'
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Instance can serve predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ready:
                  summary: All dependencies up
                  value:
                    status: ready
                    reasons: []
                    checks:
                      model:
                        status: ok
                        detail: mlflow_registry version 3
                      mlflow:
                        status: ok
                      database:
                        status: ok
                degraded:
                  summary: Local fallback model
                  value:
                    status: degraded
                    reasons:
                    - model_served_from_local_fallback
                    - mlflow_unreachable
                    checks:
                      model:
                        status: degraded
                        detail: local_artifact version credit_model_v1
                      mlflow:
                        status: down
                        detail: tracking server unreachable
                      database:
                        status: ok
        '503':
          description: No model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: not_ready
                reasons:
                - model_not_loaded
                - mlflow_unreachable
                checks:
                  model:
                    status: down
                    detail: No model could be loaded from MLflow or the local fallback.
                  mlflow:
                    status: down
                    detail: tracking server unreachable
                  database:
                    status: ok
  /metrics:
    get:
      tags:
