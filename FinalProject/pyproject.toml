[project]
name = "final-project-credit-risk-mlops"
version = "1.0.0"
description = "DDM501 Final Project: End-to-End MLOps Closed Loop Credit Default Risk Scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mlflow>=2.19.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.21.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "joblib>=1.4.0",
    "evidently>=0.7.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "flake8>=7.1.0",
    "black>=24.10.0",
]

[tool.uv]
package = false
