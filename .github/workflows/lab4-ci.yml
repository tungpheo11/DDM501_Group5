# =============================================================================
# CI Pipeline for Monitoring & Production Deployment - Lab 4
# DDM501 - Lab 4: Monitoring, Drift Detection & Alerting
# =============================================================================

name: Lab 4 - CI Pipeline

on:
  push:
    branches: [main, master, develop, Lab4, lab4, 'Lab4/**', 'lab4/**']
    paths:
      - 'Lab4/**'
      - '.github/workflows/lab4-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Lab4/**'
      - '.github/workflows/lab4-ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIR: Lab4
  PYTHONPATH: "."

jobs:
  # ---------------------------------------------------------------------------
  config:
    name: Prometheus configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          VERSION=2.51.2
          curl -sSL -o prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz"
          tar xzf prom.tar.gz
          sudo mv "prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/

      - name: Check rule syntax
        run: promtool check rules monitoring/prometheus/alerts/*.yml

      - name: Unit-test the alert rules
        # Feeds synthetic time series through the real rule evaluator and asserts
        # which alerts fire and when. Catches a typo in PromQL or a `for:`
        # window that can never elapse — the worst time to find these is during
        # an actual incident.
        working-directory: ${{ env.WORKING_DIR }}/monitoring/prometheus/tests
        run: promtool test rules alert_tests.yml

      - name: Check the compose file
        run: docker compose config --quiet

  # ---------------------------------------------------------------------------
  test:
    name: Tests (79 tests, coverage ≥ 85%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Lab4/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the dataset
        # 30,000 rows, UCI credit-default schema — generated offline so the
        # university network restriction does not affect CI.
        run: python scripts/make_dataset.py

      - name: Train the model
        # ROC AUC ≈ 0.747 — the exact number is non-deterministic, but the
        # pipeline is deterministic given the same random seed.
        run: python scripts/train_model.py

      - name: Build the drift reference
        # Quantile bins computed from the training split, written to
        # models/reference.json. Running this after training ensures the
        # reference matches the model the tests will load.
        run: python scripts/make_reference.py

      - name: Run the full test suite
        run: pytest --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab4-coverage
          path: |
            Lab4/.coverage
            Lab4/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  stack:
    name: Stack smoke test — Prometheus scrapes the API
    runs-on: ubuntu-latest
    needs: [config, test]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the model and reference (image needs them as bind mounts)
        run: |
          pip install -r requirements.txt
          python scripts/make_dataset.py
          python scripts/train_model.py
          python scripts/make_reference.py

      - name: Start the monitoring stack
        # Four containers: api, prometheus, grafana, (alertmanager optional).
        # No IP addresses in any config — Docker embedded DNS resolves service
        # names, which is what the scrape target `api:8000` relies on.
        run: docker compose up -d --build

      - name: Wait for the API to be healthy (30s timeout)
        run: |
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health \
                | python -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('model_loaded') is True else 1)"; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker compose logs api
          exit 1

      - name: Generate normal traffic (250 requests)
        # Seeds the monitoring window so drift metrics are non-zero and
        # Prometheus has something to scrape.
        run: python scripts/load_test.py --profile normal --requests 250 --delay 0

      - name: Assert Prometheus is scraping the API
        # The end-to-end assertion: a metric produced by the service has
        # arrived in Prometheus. A green unit-test suite proves the metric is
        # exported; only this step proves it is collected.
        run: |
          sleep 15
          UP=$(curl -sf "localhost:9090/api/v1/query?query=up%7Bjob%3D%22credit-risk-api%22%7D" \
               | python -c "import json,sys; print(json.load(sys.stdin)['data']['result'][0]['value'][1])")
          echo "up = $UP"
          test "$UP" = "1"

      - name: Assert drift metric has reached Prometheus
        # Confirms the /metrics endpoint is returning ml_drift_window_size
        # AND Prometheus is collecting it — the two failure modes are distinct.
        run: |
          COUNT=$(curl -sf "localhost:9090/api/v1/query?query=ml_drift_window_size" \
                  | python -c "import json,sys; print(len(json.load(sys.stdin)['data']['result']))")
          test "$COUNT" -ge 1

      - name: Assert Grafana dashboards loaded
        # Provisioned dashboards must be available via API; a dashboard that
        # exists only in someone's browser session is not a provisioned one.
        run: |
          for i in $(seq 1 10); do
            COUNT=$(curl -sf -u admin:admin "localhost:3000/api/search?type=dash-db" \
                    | python -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 2 ]; then
              break
            fi
            sleep 3
          done
          echo "Grafana dashboard check: $COUNT"
          test "$COUNT" -ge 2

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
