name: Final Project CI/CD Pipeline

on:
  push:
    paths:
      - 'FinalProject/**'
      - '.github/workflows/final-project-ci.yml'
  pull_request:
    paths:
      - 'FinalProject/**'
      - '.github/workflows/final-project-ci.yml'

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Comprehensive Test Suite (>80%), and Fairness Audit
  # ============================================================================
  lint-and-test:
    name: Code Quality, Tests & Responsible AI Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FinalProject

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Code Style & Lint Check (flake8)
        run: uv run flake8 src app tests scripts

      - name: Run Test Suite & Coverage Gate (pytest >= 80% coverage)
        run: uv run pytest -v tests/ --cov=src --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run Responsible AI Fairness & Explainability Audit
        run: uv run python scripts/run_fairness_audit.py

      - name: Upload Test & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            FinalProject/coverage.xml
            FinalProject/reports/fairness_audit.json

  # ============================================================================
  # Stage 2: Multi-Container Docker Build Validation
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FinalProject

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: FinalProject
          file: FinalProject/Dockerfile
          push: false
          load: true
          tags: credit-risk-api:ci-test

      - name: Export Docker Image for Smoke Test
        run: docker save credit-risk-api:ci-test -o /tmp/credit-risk-api.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp/credit-risk-api.tar
          retention-days: 1

  # ============================================================================
  # Stage 3: Live Smoke Test Deployment & API Validation
  # ============================================================================
  smoke-test-deployment:
    name: Deployment Smoke Test & Endpoint Verification
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp

      - name: Load Docker Image
        run: docker load -i /tmp/credit-risk-api.tar

      - name: Launch Model Serving Container
        run: |
          docker run -d --name test-api \
            -p 8000:8000 \
            -e MODEL_NAME=credit_model_v1.joblib \
            -e DATABASE_URL="" \
            credit-risk-api:ci-test
          sleep 5

      - name: Verify Health Endpoint (/health)
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health | grep -q '"status":"healthy"'; then
              echo "✓ API Healthcheck passed!"
              exit 0
            fi
            echo "Waiting for API to become healthy... ($i/15)"
            sleep 2
          done
          echo "❌ API failed healthcheck timeout"
          docker logs test-api
          exit 1

      - name: Smoke Test Credit Inference (/predict)
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "LIMIT_BAL": 200000.0,
              "SEX": 1,
              "EDUCATION": 2,
              "MARRIAGE": 1,
              "AGE": 35,
              "PAY_0": 0,
              "PAY_2": 0,
              "PAY_3": 0,
              "PAY_4": 0,
              "PAY_5": 0,
              "PAY_6": 0,
              "BILL_AMT1": 15000.0,
              "BILL_AMT2": 14000.0,
              "BILL_AMT3": 13000.0,
              "BILL_AMT4": 12000.0,
              "BILL_AMT5": 11000.0,
              "BILL_AMT6": 10000.0,
              "PAY_AMT1": 2000.0,
              "PAY_AMT2": 2000.0,
              "PAY_AMT3": 2000.0,
              "PAY_AMT4": 2000.0,
              "PAY_AMT5": 2000.0,
              "PAY_AMT6": 2000.0
            }')
          echo "Inference Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"risk_decision"' || (echo "Missing risk_decision" && exit 1)
          echo "$RESPONSE" | grep -q '"default_probability"' || (echo "Missing default_probability" && exit 1)
          echo "✓ Live inference endpoint verified successfully!"

      - name: Smoke Test Telemetry Endpoint (/metrics)
        run: |
          METRICS=$(curl -s http://localhost:8000/metrics)
          echo "$METRICS" | grep -q 'credit_prediction_requests_total' || (echo "Missing prediction metric" && exit 1)
          echo "✓ Prometheus metrics endpoint verified!"

      - name: Clean Container Teardown
        if: always()
        run: |
          docker stop test-api || true
          docker rm test-api || true
