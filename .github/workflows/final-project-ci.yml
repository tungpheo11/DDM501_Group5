# =============================================================================
# Final Project (Credit Default Risk Scoring) — Continuous Integration
#
#   lint ──────────┐
#   test ──────────┼──> ci-result   (single required status check)
#   image ─────────┘    build API + staff portal -> Trivy (fail on CRITICAL) -> compose smoke
#
# Every step calls a FinalProject/Makefile target, so `make ci` reproduces this
# pipeline locally. Also reused by final-project-cd.yml as the release gate.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
# =============================================================================

name: Final Project CI

on:
  push:
    branches: ["**"]
    paths:
      - "FinalProject/**"
      - ".github/workflows/final-project-ci.yml"
  pull_request:
    paths:
      - "FinalProject/**"
      - ".github/workflows/final-project-ci.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: final-project-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.19"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash
    working-directory: FinalProject

jobs:
  lint:
    name: Lint & type check (ruff, black, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv + Python (cached)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: FinalProject/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: ruff + black --check + mypy
        run: make lint

  test:
    name: Tests (unit, integration, data quality, model validation) + coverage >= 80%
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv + Python (cached)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: FinalProject/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Test suites with combined coverage gate
        run: make test-ci COV_MIN=80
        env:
          MPLBACKEND: Agg

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f .coverage ]]; then
            {
              echo "### Coverage (gate >= 80%)"
              .venv/bin/coverage report --format=markdown --skip-covered
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage + JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-project-coverage
          path: FinalProject/reports/coverage/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Build images, Trivy scan & compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_IMAGE: credit-risk-api:ci-${{ github.sha }}
      PORTAL_IMAGE: credit-risk-staff-portal:ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build multi-stage API image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: FinalProject
          file: FinalProject/deploy/docker/Dockerfile.api
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=final-project-api
          cache-to: type=gha,mode=max,scope=final-project-api

      # Same builder stage as the API image, so the dependency layer comes from the API cache.
      - name: Build multi-stage staff portal image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: FinalProject
          file: FinalProject/services/staff_portal/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.PORTAL_IMAGE }}
          cache-from: |
            type=gha,scope=final-project-api
            type=gha,scope=final-project-portal
          cache-to: type=gha,mode=max,scope=final-project-portal

      - name: Image size
        run: |
          {
            docker image ls "${API_IMAGE%%:*}" --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |'
            docker image ls "${PORTAL_IMAGE%%:*}" --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan (fails on CRITICAL)
        run: make scan API_IMAGE="$API_IMAGE"

      - name: Trivy scan of the staff portal image (fails on CRITICAL)
        run: make scan-portal PORTAL_IMAGE="$PORTAL_IMAGE"

      - name: Compose smoke test (up -> health -> predict -> portal login/403/score -> down)
        run: make smoke API_IMAGE="$API_IMAGE" PORTAL_IMAGE="$PORTAL_IMAGE" ENV_FILE=.env.example SMOKE_TIMEOUT=300

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-project-security
          path: FinalProject/reports/security/
          if-no-files-found: warn
          retention-days: 14

  ci-result:
    name: CI result
    if: always()
    needs: [lint, test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || { echo "::error::CI failed ($RESULTS)"; exit 1; }
          done
