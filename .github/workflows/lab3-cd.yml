# =============================================================================
# CD Pipeline for Movie Rating API - Lab 3
# DDM501 - Lab 3: Testing & CI/CD
# =============================================================================

name: Lab 3 - CD Pipeline

on:
  push:
    tags:
      - 'lab3-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (e.g. lab3-v1.0.0)'
        required: true
        default: 'lab3-v1.0.0'

jobs:
  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    defaults:
      run:
        working-directory: Lab3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (install deps & train model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Lab3/requirements.txt

      - name: Install dependencies and train model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/train_model.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^lab3-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag: expected lab3-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: Lab3
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:latest
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ steps.tag.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Lab 3 - Release ${{ steps.tag.outputs.version }}
          body: |
            ## Movie Rating API (Lab 3) - ${{ steps.tag.outputs.version }}

            Automated release for Lab 3 version ${{ steps.tag.outputs.version }}.

            ### Docker Image
            ```
            docker pull ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ steps.tag.outputs.version }}
            ```

            ### Run the API
            ```
            docker run -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ steps.tag.outputs.version }}
            ```
          draft: false
          prerelease: false

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "::warning::Staging deployment is not configured; no host was updated."
          echo "Image ready: ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ needs.build-and-push.outputs.version }}"

  # ===========================================================================
  # Deploy to Production (requires manual approval)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "::warning::Production deployment is not configured; no host was updated."
          echo "Image ready: ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ needs.build-and-push.outputs.version }}"
