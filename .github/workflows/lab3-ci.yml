# =============================================================================
# CI Pipeline for Movie Rating API - Lab 3
# DDM501 - Lab 3: Testing & CI/CD
# =============================================================================

name: Lab 3 - CI Pipeline

on:
  push:
    branches: [main, develop, Lab3, lab3, 'Lab3/**', 'lab3/**']
    paths:
      - 'Lab3/**'
      - '.github/workflows/lab3-ci.yml'
      - 'Lab3/.github/workflows/lab3-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Lab3/**'
      - '.github/workflows/lab3-ci.yml'
      - 'Lab3/.github/workflows/lab3-ci.yml'
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Linting Job
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Lab3/requirements*.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=100 --exclude=__pycache__,venv,.venv

      - name: Check black formatting
        run: black --check app/ tests/ --line-length=100

      - name: Check import sorting
        run: isort --check-only app/ tests/ --profile=black --line-length=100

  # ===========================================================================
  # Type Checking Job
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Lab3/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: Lab3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Lab3/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: Lab3/coverage.xml
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Lab3/htmlcov/
          retention-days: 7

  # ===========================================================================
  # Build Docker Image Job
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: Lab3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Lab3/requirements*.txt

      - name: Install dependencies & train model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/train_model.py

      - name: Build Docker image
        run: docker build -t movie-rating-api:ci .

      - name: Start container and hit the API
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "${{ github.workspace }}/Lab3/models:/app/models:ro" \
            movie-rating-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "API is up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_id": "196", "movie_id": "242"}' \
            | tee /dev/stderr | grep -q 'predicted_rating'
          for i in $(seq 1 40); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' api)" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' api)" = "healthy"
          docker stop api
