# TASK 12 — model-level alert rules.
#
# api_alerts.yml is the worked example: read it first. Every rule there has
#   - an `expr` that means the same thing at 10 rps and at 1000 rps,
#   - a `for:` longer than one scrape, so a single bad sample cannot page you,
#   - a `severity` label,
#   - a `summary` saying what is wrong and a `description` saying what to do
#     about it. An alert whose recipient has to reverse-engineer the intent at
#     3am is an alert that gets ignored by the second week.
#
# These rules are different in kind from the ones in api_alerts.yml: none of
# them proves the model is wrong. Each is a reason to LOOK.
#
# Write the seven rules below. tests/test_config_files.py checks the structure;
# monitoring/prometheus/tests/alert_tests.yml checks the behaviour, and you can
# run it before you have a Prometheus instance at all:
#
#     cd monitoring/prometheus/tests && promtool test rules alert_tests.yml
#
# The metric names you need are all in app/metrics.py.

groups:
  - name: ml_drift
    rules:
      - alert: ModerateFeatureDrift
        expr: ml_drift_score >= 0.10
        for: 15m
        labels:
          severity: warning
          signal: leading
        annotations:
          summary: "Input drift in the moderate band (PSI {{ $value | printf \"%.3f\" }})"
          description: >-
            The applicants arriving no longer match the training population.
            The model is not broken and its outputs are still well-formed;
            this is the earliest signal available, weeks before any accuracy
            number could arrive. Check ml_feature_drift_psi by feature to see
            which one moved, and whether it moved for a reason you already
            know about (a new marketing channel, a seasonal effect).

      - alert: SignificantFeatureDrift
        expr: ml_drift_score >= 0.25
        for: 15m
        labels:
          severity: critical
          signal: leading
        annotations:
          summary: "Input drift is significant (PSI {{ $value | printf \"%.3f\" }})"
          description: >-
            Retraining is likely warranted. Before triggering it, confirm the
            drift is real and not an artefact: a single upstream system
            sending a default value for a field produces exactly this
            signature and is fixed in the pipeline, not in the model.

      - alert: DriftWindowTooSmall
        expr: ml_drift_window_size < 200
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Drift window has fewer than 200 requests"
          description: >-
            Not a model problem — a statistics problem. The drift number
            reported below this size is noise, and the service reports it as
            insufficient rather than as zero. This alert exists so that
            "drift is fine" is never inferred from "drift is not being
            measured".

  - name: ml_behaviour
    rules:
      - alert: DecisionMixShift
        expr: |
          sum(rate(ml_decisions_total{decision="DECLINE"}[30m]))
          /
          sum(rate(ml_decisions_total[30m]))
          > 0.20
        for: 30m
        labels:
          severity: warning
          signal: output
        annotations:
          summary: "DECLINE rate has exceeded 20% (baseline ~8%)"
          description: >-
            The share of applications being declined has risen well above the
            baseline. This may reflect a population shift (more high-risk
            applicants) or a model behaviour change. Compare ml_drift_score
            and ml_prediction_score to distinguish the two causes.

      - alert: FairnessGapWidened
        expr: ml_fairness_gap > 0.10
        for: 20m
        labels:
          severity: critical
          signal: fairness
        annotations:
          summary: "Selection-rate gap between groups is {{ $value | printf \"%.3f\" }}"
          description: >-
            One group is being sent to review or decline at a materially
            different rate than another. Aggregate drift and aggregate score
            metrics can both look healthy while this fires — that is the
            point of measuring it separately. Confirm against
            ml_selection_rate by group before acting; a gap that reflects a
            real change in who is applying is a different problem from a gap
            the model introduced.

      - alert: PredictionErrorsRising
        expr: rate(ml_prediction_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          signal: reliability
        annotations:
          summary: "Model prediction errors above 0.1/s"
          description: >-
            Failures inside the model call are rising. Distinct from HTTP 5xx:
            these are errors within the scoring logic itself. Check
            ml_prediction_errors_total by error_type for the specific
            failure mode.

      - alert: ExplanationLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ml_explain_duration_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          signal: performance
        annotations:
          summary: "p95 explanation latency above 1 second"
          description: >-
            SHAP computation is taking too long at the 95th percentile.
            Explanation latency is measured separately from prediction latency
            so a slow /explain cannot hide inside the prediction percentile.
            Check whether load has increased or whether the model complexity
            has changed.

